<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0d16">
  <title>OBS Live · 直播观看</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/vendor/hls.min.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="glow glow-one"></div>
  <div class="glow glow-two"></div>

  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-icon"><span></span></span>
      <span>OBS<b>Live</b></span>
    </a>
    <div class="topbar-right">
      <span class="server-pill" id="server-pill"><i></i><span id="server-text">连接中</span></span>
      <span class="clock" id="clock">--:--:--</span>
    </div>
  </header>

  <main class="layout">
    <section class="stage">
      <div class="stage-head">
        <div>
          <p class="eyebrow">LIVE CHANNEL</p>
          <h1 id="channel-title">studio</h1>
        </div>
        <div class="badges">
          <span class="badge badge-live" id="live-badge"><i></i>等待信号</span>
          <span class="badge badge-ghost">HLS · 低延迟</span>
        </div>
      </div>

      <div class="player-shell" id="player-shell">
        <video id="player" playsinline controls muted></video>
        <div class="overlay" id="overlay">
          <div class="radar"><span></span><span></span><i></i></div>
          <p class="overlay-title" id="overlay-title">等待推流信号</p>
          <p class="overlay-text" id="overlay-text">等待推流信号，连接信息请在服务器终端查看，开始推流后画面会自动出现在这里。</p>
        </div>
      </div>

      <div class="player-bar">
        <div class="meta">
          <span>开播时长 <b id="uptime">--:--:--</b></span>
          <span>画质 <b id="resolution">--</b></span>
          <span>频道 <b id="channel-name">studio</b></span>
        </div>
        <div class="player-actions">
          <button class="btn" id="mute-btn" type="button">取消静音</button>
          <button class="btn" id="reload-btn" type="button">重新连接</button>
          <button class="btn" id="fullscreen-btn" type="button">全屏</button>
        </div>
      </div>
      <p class="notice" id="notice" hidden></p>
    </section>

    <aside class="sidebar">
      <section class="card">
        <div class="card-head">
          <h2>在线频道</h2>
          <span class="count" id="channel-count">0</span>
        </div>
        <div class="channel-list" id="channel-list">
          <p class="empty">暂无频道在线</p>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>资源状态</h2>
          <span class="tag tag-soft" id="segment-tag">分片 2s</span>
        </div>
        <div class="capacity">
          <span>上行 <b id="uplink">--</b></span>
          <span>推流码率 <b id="in-bitrate">--</b></span>
          <span>建议观看 <b id="max-viewers">--</b></span>
        </div>
        <p class="hint">每位观众占用一份推流码率，超过建议人数会卡顿。转封装不重编码，CPU 占用低。</p>
      </section>
    </aside>
  </main>

  <footer class="footer">OBS Live · 实时直播观看</footer>
</body>
</html>
